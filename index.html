<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IA System Documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css" />
  <style>
    /* ─── Theme Variables ─── */
    :root {
      --bg:           #eef1f8;
      --text-primary: #111111;
      --text-secondary: #777777;
      --text-muted:   #aaaaaa;
      --border:       rgba(0,0,0,0.07);
      --toggle-bg:    rgba(0,0,0,0.06);
      --toggle-hover: rgba(0,0,0,0.10);
      --footer-text:  #c0c0c0;
    }
    [data-theme="dark"] {
      --bg:           #0e0e1a;
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.5);
      --text-muted:   rgba(255,255,255,0.22);
      --border:       rgba(255,255,255,0.07);
      --toggle-bg:    rgba(255,255,255,0.08);
      --toggle-hover: rgba(255,255,255,0.14);
      --footer-text:  rgba(255,255,255,0.2);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
      padding: 40px 24px 48px;
    }

    /* ─── Theme toggle ─── */
    .theme-toggle {
      position: fixed;
      top: 20px; right: 20px;
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--toggle-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-primary);
      transition: background 0.2s;
      z-index: 100;
    }
    .theme-toggle:hover { background: var(--toggle-hover); }
    .theme-toggle:active { transform: scale(0.93); }

    /* ─── Header ─── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .header-meta {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      line-height: 1.15;
    }
    .header-sub {
      font-size: 15px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* ─── Card Grid ─── */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      width: 100%;
      max-width: 720px;
    }

    /* ─── Card ─── */
    .card {
      border-radius: 28px;
      padding: 36px 28px 28px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.18);
    }
    .card:active { transform: translateY(-3px); }

    /* ─── Card art area ─── */
    .card-art {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      position: relative;
    }
    .card-art svg {
      width: 140px;
      height: 140px;
    }

    /* ─── Blob (bottom corner only) ─── */
    .card-blob {
      position: absolute;
      border-radius: 50%;
      bottom: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      opacity: 0.45;
      pointer-events: none;
    }
    .card-shine {
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      pointer-events: none;
    }

    /* ─── Card text ─── */
    .card-body { position: relative; z-index: 2; }
    .card-tag {
      font-size: 9px;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      margin-top: 6px;
      line-height: 1.5;
    }
    .card-cta {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 20px;
      padding: 9px 18px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      transition: background 0.2s;
    }
    .card:hover .card-cta { background: rgba(255,255,255,0.22); }

    /* ─── Footer ─── */
    footer {
      margin-top: 40px;
      font-size: 12px;
      color: var(--footer-text);
      text-align: center;
    }

    /* ─── Dark mode glow ─── */
    [data-theme="dark"] body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(24,95,165,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    [data-theme="dark"] body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(15,110,86,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      body { padding: 72px 16px 40px; justify-content: flex-start; }
      header { margin-bottom: 32px; }
      .card-grid { gap: 14px; max-width: 100%; }
      .card { min-height: 300px; padding: 28px 20px 22px; border-radius: 22px; }
      .card-art svg { width: 110px; height: 110px; }
      .card-title { font-size: 15px; }
      .card-desc { font-size: 11px; }
    }

    @media (max-width: 400px) {
      .card-grid { grid-template-columns: 1fr; max-width: 340px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <!-- Theme toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <i class="ti ti-moon" id="themeIcon"></i>
  </button>

  <!-- Header -->
  <header>
    <div class="header-meta">Intelligence Analytics</div>
    <h1>IA System Documentation</h1>
    <div class="header-sub">Select a module to get started</div>
  </header>

  <!-- Cards -->
  <main>
    <div class="card-grid" id="cardGrid"></div>
  </main>

  <!-- Footer -->
  <footer>IA System Documentation &nbsp;·&nbsp; 2 Modules</footer>

<script>
  const modules = [
    {
      num: '01',
      title: 'IA Violation System',
      desc: 'Track, log and resolve violations across all IA activities',
      fill: '#1a6bbf',
      blob: '#0f4a8a',
      href: 'Violation_Project_Documentation.html',
      art: `
        <!-- Floating shield illustration -->
        <g transform="translate(70,70)">
          <!-- soft glow behind shield -->
          <ellipse cx="0" cy="10" rx="42" ry="38" fill="rgba(255,255,255,0.08)"/>
          <!-- shield body -->
          <path d="M0,-44 L38,-28 L38,8 Q38,38 0,52 Q-38,38 -38,8 L-38,-28 Z"
                fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
          <path d="M0,-36 L30,-22 L30,8 Q30,32 0,44 Q-30,32 -30,8 L-30,-22 Z"
                fill="rgba(255,255,255,0.22)"/>
          <!-- checkmark -->
          <path d="M-14,4 L-4,14 L18,-10"
                stroke="rgba(255,255,255,0.95)" stroke-width="5"
                stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <!-- floating dots decoration -->
          <circle cx="52" cy="-30" r="5" fill="rgba(255,255,255,0.2)"/>
          <circle cx="58" cy="-18" r="3" fill="rgba(255,255,255,0.15)"/>
          <circle cx="-52" cy="20" r="4" fill="rgba(255,255,255,0.15)"/>
          <circle cx="-58" cy="8" r="6" fill="rgba(255,255,255,0.12)"/>
          <!-- sparkle lines -->
          <line x1="46" y1="-46" x2="46" y2="-38" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="42" y1="-42" x2="50" y2="-42" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      `
    },
    {
      num: '02',
      title: 'IA Monitoring System',
      desc: 'Real-time activity monitoring and live system oversight',
      fill: '#1a9070',
      blob: '#0a5c46',
      href: 'IA_System_Monitoring_Documentation.html',
      art: `
        <!-- Radar / signal illustration -->
        <g transform="translate(70,70)">
          <!-- soft glow -->
          <ellipse cx="0" cy="0" rx="44" ry="40" fill="rgba(255,255,255,0.07)"/>
          <!-- radar arcs (outward waves, no filled circles) -->
          <path d="M-36,-36 Q0,-52 36,-36" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
          <path d="M-24,-24 Q0,-36 24,-24" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M-12,-12 Q0,-20 12,-12" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
          <!-- center dot -->
          <circle cx="0" cy="0" r="7" fill="rgba(255,255,255,0.9)"/>
          <circle cx="0" cy="0" r="3" fill="rgba(255,255,255,1)"/>
          <!-- sweep arm -->
          <line x1="0" y1="0" x2="30" y2="-26"
                stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round"/>
          <!-- signal ping dot -->
          <circle cx="28" cy="-24" r="5" fill="rgba(255,255,255,0.9)"/>
          <!-- base stand -->
          <rect x="-18" y="14" width="36" height="8" rx="4" fill="rgba(255,255,255,0.25)"/>
          <rect x="-6" y="22" width="12" height="20" rx="3" fill="rgba(255,255,255,0.2)"/>
          <rect x="-20" y="40" width="40" height="6" rx="3" fill="rgba(255,255,255,0.18)"/>
          <!-- floating dots -->
          <circle cx="-50" cy="-28" r="4" fill="rgba(255,255,255,0.18)"/>
          <circle cx="-56" cy="-14" r="3" fill="rgba(255,255,255,0.12)"/>
          <circle cx="50" cy="10" r="5" fill="rgba(255,255,255,0.15)"/>
          <circle cx="56" cy="24" r="3" fill="rgba(255,255,255,0.12)"/>
          <!-- sparkle -->
          <line x1="-46" y1="-44" x2="-46" y2="-36" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="-50" y1="-40" x2="-42" y2="-40" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
        </g>
      `
    }
  ];

  document.getElementById('cardGrid').innerHTML = modules.map(m => `
    <a class="card" href="${m.href}" style="background: ${m.fill};">
      <div class="card-shine"></div>
      <div class="card-blob" style="background: ${m.blob};"></div>
      <div class="card-art">
        <svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
          ${m.art}
        </svg>
      </div>
      <div class="card-body">
        <div class="card-tag">MODULE ${m.num}</div>
        <div class="card-title">${m.title}</div>
        <div class="card-desc">${m.desc}</div>
        <div class="card-cta">
          <i class="ti ti-arrow-right" aria-hidden="true"></i> Open module
        </div>
      </div>
    </a>
  `).join('');

  function toggleTheme() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
    localStorage.setItem('ia-theme', next);
  }

  (function () {
    const saved = localStorage.getItem('ia-theme') || 'light';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  })();
</script>

</body>
</html>
